[pytest]
# feat-015: register the real-API smoke marker so `-m smoke` selects it and the mock battery
# stays warning-free. The smoke test skips itself (SKIPPED-need-keys) when no key is configured.
markers =
    smoke: real-API smoke test (needs a live brain key; skips cleanly without one)
    seedgate: feat-022 integration gate (real :8137 service + real seed uploads; needs live keys; skips cleanly without them)
    needs_db: feat-030 persistence layer vs a REAL Postgres (needs AVERY_DB_URL/PGVECTOR_URL; skips cleanly without one)
