[pytest]
# feat-015: register the real-API smoke marker so `-m smoke` selects it and the mock battery
# stays warning-free. The smoke test skips itself (SKIPPED-need-keys) when no key is configured.
markers =
    smoke: real-API smoke test (needs a live brain key; skips cleanly without one)
    seedgate: feat-022 integration gate (real :8137 service + real seed uploads; needs live keys; skips cleanly without them)
    needs_db: feat-030 persistence layer vs a REAL Postgres (needs AVERY_DB_URL/PGVECTOR_URL; skips cleanly without one)
    needs_keys: feat-031 test that hits a REAL embedding endpoint (needs DASHSCOPE_API_KEY). Deselect with `-m "not needs_keys"` for a literally-zero-network offline run; skips cleanly without the key.
    bug3: RETIRED in feat-048 round 2 — no test carries this marker any more. It quarantined extract.py::_looks_like_name (`^[A-Z]` drops Han names before _slug is called) while round 1 fixed only the _slug collapse / cross-doc dedup blockers. BUG-3 is now IN SCOPE and its gates (tests/test_cjk_identity.py, *_BUG3) must go green like any other. Registration kept so an existing `-m "not bug3"` invocation keeps working; delete once no runbook references it.
